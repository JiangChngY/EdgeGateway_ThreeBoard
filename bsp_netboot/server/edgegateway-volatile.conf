[Service]
# /var/volatile is a fresh tmpfs on every NFS-root boot.  The vendor image
# expects these paths to exist before services using PrivateTmp are started.
ExecStartPre=/bin/mkdir -p /var/volatile/tmp /var/volatile/log /var/volatile/lib/nfs/statd
ExecStartPre=/bin/chmod 1777 /var/volatile/tmp
ExecStartPre=/bin/touch /var/volatile/log/lastlog
ExecStartPre=/bin/chmod 0664 /var/volatile/log/lastlog

